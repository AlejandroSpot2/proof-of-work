<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Quietroom: feedback to schema-checked draft issues (EXAMPLE)">
<rect width="480" height="300" fill="#e1dfd9"/>

<g font-family="Switzer, Arial, sans-serif" font-size="14" fill="#2a340b">
<rect x="24" y="36" width="140" height="40" fill="#f3f3f1"/><text x="36" y="61">"app logs me out"</text>
<rect x="24" y="88" width="140" height="40" fill="#f3f3f1"/><text x="36" y="113">"lost my session"</text>
<rect x="24" y="140" width="140" height="40" fill="#f3f3f1"/><text x="36" y="165">"ignore previous..."</text>
<rect x="24" y="192" width="140" height="40" fill="#f3f3f1"/><text x="36" y="217">"export is slow"</text>
<path d="M164 56 L250 120 M164 108 L250 124 M164 212 L250 196" stroke="#2a340b" stroke-width="2" fill="none"/>
<rect x="250" y="92" width="206" height="56" fill="#38450f"/><text x="262" y="116" fill="#f3f3f1">Draft: session expiry</text><text x="262" y="136" fill="#f3f3f1">schema ok, 2 users</text>
<rect x="250" y="172" width="206" height="44" fill="#f3f3f1"/><text x="262" y="199">Draft: export speed</text>
<text x="176" y="170" fill="#38450f">treated as data</text>
</g>
<text x="24" y="282" font-family="Switzer, Arial, sans-serif" font-size="13" fill="#5d683a">EXAMPLE illustration</text>
</svg>
