<g font-family="Switzer, Arial, sans-serif" font-size="14" fill="#2a340b">
<rect x="24" y="60" width="120" height="50" fill="#f3f3f1"/><text x="38" y="90">PR opened</text>
<rect x="180" y="60" width="140" height="50" fill="#38450f"/><text x="194" y="90" fill="#f3f3f1">preview deploy</text>
